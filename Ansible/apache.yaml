- name: Install and Configure Apache Web Server
  hosts: web
  become: yes
  remote_user: ec2-user

  tasks:

    - name: Install Apache
      yum:
        name: httpd
        state: present

    - name: Install PHP (optional)
      yum:
        name: php
        state: present

    - name: Copy index file
      copy:
        src: index.php
        dest: /var/www/html/index.php
        mode: '0644'

    - name: Enable Apache service
      service:
        name: httpd
        enabled: yes

    - name: Start Apache service
      service:
        name: httpd
        state: started

